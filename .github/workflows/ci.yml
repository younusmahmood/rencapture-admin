name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Route tree is up to date
        run: |
          npm run generate-routes
          git diff --exit-code --stat src/routeTree.gen.ts \
            || { echo "::error::src/routeTree.gen.ts is stale — run 'npm run generate-routes' and commit."; exit 1; }

      - run: npm run typecheck

      - name: Build
        env:
          CONVEX_URL: ${{ vars.CONVEX_URL || 'https://example.convex.cloud' }}
        run: npm run build
